# Universe Data Booklet - Nginx reverse proxy configuration
# 
# Copy to /etc/nginx/sites-available/universe-booklet and symlink to
# /etc/nginx/sites-enabled/, then run: sudo nginx -t && sudo systemctl reload nginx
#
# This config:
#   - Proxies to the Python backend on 127.0.0.1:8081
#   - Terminates TLS (update ssl_certificate paths for your domain)
#   - Sets security headers
#   - Enables gzip compression
#   - Sets proper caching for static assets

# Upstream backend
upstream universe_booklet_backend {
    server 127.0.0.1:8081;
    keepalive 64;
}

# HTTP block (redirect to HTTPS in production)
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Redirect all HTTP traffic to HTTPS (remove in development/staging)
    return 301 https://$host$request_uri;
}

# HTTPS server (production)
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # TLS configuration - update paths for your domain
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Max request size (for PDF uploads if any)
    client_max_body_size 10m;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/pdf
        application/x-javascript
        application/x-shockwave-flash
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    location / {
        proxy_pass http://universe_booklet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
            proxy_pass http://universe_booklet_backend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # API endpoints - no caching
        location /api/ {
            proxy_pass http://universe_booklet_backend;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store";
        }
    }
}

# Development server (no TLS, for local testing)
# Copy to /etc/nginx/sites-available/universe-booklet-dev and enable as needed.
server {
    listen 8080;
    server_name localhost;

    location / {
        proxy_pass http://universe_booklet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $127.0.0.1;
    }
}